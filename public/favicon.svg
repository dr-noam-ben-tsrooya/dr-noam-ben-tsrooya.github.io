<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Medical Doctor Stethoscope Favicon - Dr. Noam Ben Tsrooya -->
  <rect width="64" height="64" rx="16" fill="#351E06"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#8D7E6D" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Binaural Headset (Earpieces) -->
  <path d="M 21 13 L 21 21 C 21 30 27 34 32 34 C 37 34 43 30 43 21 L 43 13" 
        fill="none" stroke="#FAF7F2" stroke-width="3.5" stroke-linecap="round"/>
        
  <!-- Soft Clay Ear Tips -->
  <circle cx="21" cy="13" r="2.8" fill="#DFB09E"/>
  <circle cx="43" cy="13" r="2.8" fill="#DFB09E"/>
  
  <!-- Flexible Tubing Loop -->
  <path d="M 32 34 L 32 40 C 32 50 20 50 20 42 C 20 35 37 36 40 46 L 40 48" 
        fill="none" stroke="#DFB09E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        
  <!-- Stethoscope Chestpiece / Diaphragm -->
  <circle cx="40" cy="51" r="5.5" fill="#FAF7F2"/>
  <circle cx="40" cy="51" r="2.5" fill="#351E06"/>
</svg>