<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Medical Doctor Stethoscope Favicon - Dr. Noam Ben Tsrooya -->
  <rect width="64" height="64" rx="16" fill="#351E06"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#DFB09E" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Binaural Headset (Silver/Ivory metal tubes) -->
  <path d="M 20 13 L 20 22 C 20 31 26 35 32 35 C 38 35 44 31 44 22 L 44 13" 
        fill="none" stroke="#FAF7F2" stroke-width="4.5" stroke-linecap="round"/>
        
  <!-- Soft Clay Ear Tips -->
  <circle cx="20" cy="13" r="3.2" fill="#DFB09E"/>
  <circle cx="44" cy="13" r="3.2" fill="#DFB09E"/>
  
  <!-- Flexible Tubing Loop -->
  <path d="M 32 35 L 32 40 C 32 50 18 50 18 41 C 18 33 37 35 41 46 L 41 48" 
        fill="none" stroke="#DFB09E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        
  <!-- Stethoscope Chestpiece / Diaphragm -->
  <circle cx="41" cy="51" r="6.5" fill="#FAF7F2"/>
  <circle cx="41" cy="51" r="3" fill="#351E06"/>
</svg>